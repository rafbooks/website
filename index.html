<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشر رف | دفترهای طراحی و نقاشی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- بوم نقاشی تمام صفحه -->
  <canvas id="drawCanvas"></canvas>

  <!-- افکت پاشیدن رنگ -->
  <canvas id="fxCanvas"></canvas>

  <div class="page">

    <!-- ساعت و تاریخ زنده -->
    <div class="clock-box">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-dates">
        <span id="jalaliDate">—</span>
        <span class="sep">|</span>
        <span id="gregorianDate">—</span>
      </div>
      <div class="clock-label">تهران</div>
    </div>

    <!-- لوگو -->
    <div class="logo">
      <h1>نشر رف</h1>
      <p>دفترهای طراحی و نقاشی</p>
    </div>

    <!-- متن اصلی -->
    <div class="hero">
      <h2>دفترهایی برای دیدن، کشیدن و ماندن</h2>
      <p>دفترهایی برای ثبت لحظه‌ها، تمرین خلاقیت و همراهی در مسیر ایده‌ها تا ماندگارترین شکل ممکن.</p>
    </div>

    <!-- دکمه‌ها -->
    <div class="buttons">
      <a class="btn btn-channel" href="https://t.me/YOUR_CHANNEL" target="_blank">کانال تلگرام</a>
      <a class="btn btn-bot" href="https://t.me/YOUR_BOT" target="_blank">ربات تلگرام</a>
      <a class="btn btn-manager" href="https://wa.me/989102232299" target="_blank">ارتباط با مدیر</a>
    </div>

    <!-- دکمه پخش صدا -->
    <button class="play-btn" id="playBtn">
      <span id="playIcon">▶</span>
      <span>شنیدن از نشر رف</span>
    </button>
    <audio id="rafAudio" src="assets/voice.mp3" preload="metadata"></audio>

    <!-- جعبه رنگ و کنترل نقاشی -->
    <div class="paint-tools">
      <div class="colors" id="colors">
        <button data-color="#e74c3c" style="background:#e74c3c"></button>
        <button data-color="#f39c12" style="background:#f39c12"></button>
        <button data-color="#3498db" style="background:#3498db"></button>
        <button data-color="#27ae60" style="background:#27ae60"></button>
        <button data-color="#9b59b6" style="background:#9b59b6"></button>
        <button data-color="#e91e63" style="background:#e91e63"></button>
        <button data-color="#1a1a1a" style="background:#1a1a1a"></button>
      </div>
      <button class="tool-btn" id="eraserBtn">پاک‌کن</button>
      <button class="tool-btn" id="clearBtn">پاک کردن همه</button>
    </div>

    <p class="hint">با قلم‌مو روی صفحه نقاشی کن • هر کلیک رنگ می‌پاشد</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
